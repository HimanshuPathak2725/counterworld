<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Missing wall model versus true environment</title><desc id="desc">Diagram of a wall-deleted model and the true wall with a gap</desc>
  <rect width="100%" height="100%" fill="#f6eddd"/>
  <style>
    text { font-family: Barlow, 'DejaVu Sans', sans-serif; fill: #18213d; }
    .title { font-size: 26px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #696d74; }
    .label { font-size: 12px; }
    .small { font-size: 10px; fill: #696d74; }
    .mono { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
    .axis { stroke: #cec0ad; stroke-width: 1; }
    .grid { stroke: #cec0ad; stroke-width: 1; stroke-dasharray: 3 6; opacity: .65; }
  </style>
  <text x="48" y="44" class="title" text-anchor="start" >The map is missing the wall</text><text x="48" y="70" class="subtitle" text-anchor="start" >A missing constraint changes the decision, not just the prediction error</text><rect x="90" y="135" width="300" height="220" fill="#efe3d1" rx="16"/><text x="115" y="165" class="label" text-anchor="start" >MODEL'S MAP</text><line x1="225" y1="195" x2="225" y2="310" class="axis" stroke-dasharray="7 7"/><text x="250" y="250" class="small" text-anchor="start" >wall deleted</text><circle cx="155" cy="275" r="12" fill="#1aa3a1"/><text x="115" y="330" class="small" text-anchor="start" >agent</text><circle cx="340" cy="205" r="12" fill="#d98d22"/><text x="300" y="185" class="small" text-anchor="start" >goal</text><path d="M155,275 Q250,225 340,205" fill="none" stroke="#c0652d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><rect x="490" y="135" width="300" height="220" fill="#efe3d1" rx="16"/><text x="515" y="165" class="label" text-anchor="start" >TRUE ENVIRONMENT</text><line x1="625" y1="195" x2="625" y2="240" class="axis" /><line x1="625" y1="280" x2="625" y2="310" class="axis" /><text x="648" y="265" class="small" text-anchor="start" >gap</text><circle cx="555" cy="275" r="12" fill="#1aa3a1"/><text x="515" y="330" class="small" text-anchor="start" >agent</text><circle cx="740" cy="205" r="12" fill="#d98d22"/><text x="700" y="185" class="small" text-anchor="start" >goal</text><path d="M555,275 Q640,230 625,255" fill="none" stroke="#c0652d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="625" cy="255" r="10" fill="#c0652d"/><text x="645" y="300" class="small" text-anchor="start" >collision</text><path d="M130,420 Q430,360 790,420" fill="none" stroke="#18213d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 8"/><text x="48" y="475" class="subtitle" text-anchor="start" >Same action. Different world. The regret metric must prove it adds useful warning information.</text>
</svg>